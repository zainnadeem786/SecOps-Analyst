services:
  - type: web
    name: ai-log-analyzer-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: mistral
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "120"
      - key: ALLOWED_ORIGINS
        sync: false
